<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - Schaeffler Mobility Insight Platform</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .error-container {
            text-align: center;
            padding: 50px;
            max-width: 600px;
            margin: 0 auto;
        }
        .error-icon {
            font-size: 48px;
            color: #dc3545;
            margin-bottom: 20px;
        }
        .home-button {
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="text-center mb-4">
            <img src="{{ url_for('static', filename='schaeffler-logo.svg') }}" 
                 alt="Schaeffler" style="height: 60px;">
        </div>
        
        <div class="error-container">
            <div class="error-icon">⚠️</div>
            <h2>Oops! Something went wrong</h2>
            <p>{{ error }}</p>
            <div class="home-button">
                <a href="/" class="btn btn-primary">Return to Home</a>
            </div>
        </div>
    </div>
</body>
</html>
